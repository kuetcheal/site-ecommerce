apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: site-ecommerce-backend-hpa
  namespace: site-ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: site-ecommerce-backend
  minReplicas: 1
  maxReplicas: 4 ### maximun 4 pods pour ce projet c'est suffisant
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  ### scale si CPU moyen > 60 %