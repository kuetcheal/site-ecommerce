name: Deploy Spring Boot to GKE

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: easytravel-maps-dev
  PROJECT_NUMBER: 638883425596
  REGION: europe-west9
  GAR_LOCATION: europe-west9-docker.pkg.dev
  REPOSITORY: site-ecommerce-repo
  IMAGE_NAME: site-ecommerce-backend
  CLUSTER_NAME: site-ecommerce-cluster
  NAMESPACE: site-ecommerce
  DEPLOYMENT_NAME: site-ecommerce-backend
  CONTAINER_NAME: site-ecommerce-backend
  SERVICE_ACCOUNT: github-actions-deployer@easytravel-maps-dev.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/638883425596/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot
        run: mvn clean package -DskipTests

      - name: Authentification Google Cloud sans clé JSON
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Installer Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker $GAR_LOCATION --quiet

      - name: Construire l’image Docker
        run: |
          docker build -t $GAR_LOCATION/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} .
          docker tag $GAR_LOCATION/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} $GAR_LOCATION/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest

      - name: Push vers Artifact Registry
        run: |
          docker push $GAR_LOCATION/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}
          docker push $GAR_LOCATION/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest

      - name: Récupérer les credentials GKE
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Déployer la nouvelle image dans GKE
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$GAR_LOCATION/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} -n $NAMESPACE
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE